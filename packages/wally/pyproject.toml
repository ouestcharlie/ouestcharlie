[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ouestcharlie-wally"
version = "0.17.0"
description = "OuEstCharlie Wally — photo search/consumption agent"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
authors = [
    { name = "Antoine Hue" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.0,<3.0.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "ouestcharlie-py-toolkit~=0.17",
    "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/ouestcharlie/ouestcharlie/tree/master/packages/wally"
Issues = "https://github.com/ouestcharlie/ouestcharlie/issues"

[project.scripts]
wally = "wally.__main__:main"

[tool.uv.sources]
ouestcharlie-py-toolkit = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/wally"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
tmp_path_retention_policy = "none"

[tool.ruff]
# Shared settings live in the workspace root; this file only adds per-file ignores.
extend = "../../pyproject.toml"
# First-party imports for sorting: this package (src/) and its tests (.), as in a single repo.
src = [".", "src"]

[tool.ruff.lint.per-file-ignores]
"src/wally/__main__.py" = ["E402"]  # logging must be configured before wally modules are imported

[tool.mypy]
python_version = "3.14"
strict = true
