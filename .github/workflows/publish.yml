name: Publish

# One vX.Y.Z tag publishes the three packages, all at version X.Y.Z.
on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-22.04
    environment: pypi
    permissions:
      id-token: write  # trusted publishing
      actions: read    # needed to download artifacts from another job
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      # If an upload fails halfway, "Re-run failed jobs" reuses the wheels above and
      # skips the files already on PyPI, so the release completes unchanged.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
