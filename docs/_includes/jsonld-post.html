<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": {{ page.title | jsonify }},
  "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
  "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
  "author": {
    "@type": "Organization",
    "name": {{ site.author | jsonify }},
    "url": {{ "/" | absolute_url | jsonify }}
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.author | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ "/assets/woof_large_850.png" | absolute_url | jsonify }}
    }
  },
  "image": {{ page.image | default: "/assets/woof_large_850.png" | absolute_url | jsonify }},
  "url": {{ page.url | absolute_url | jsonify }},
  "description": {{ page.description | default: page.excerpt | strip_html | strip_newlines | strip | truncate: 200 | jsonify }}
}
</script>
